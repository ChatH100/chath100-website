<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="ChatH100 的留言板 —— 留个名字，写几句话。" />
<meta name="theme-color" content="#05060f" />
<title>留言板 · ChatH100</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<link rel="stylesheet" href="styles.css?v=10" />
<script>
/* ==========================================================================
   精简模式判定 —— 必须放在页面 head 里【同步】执行，不能挪到 script.js。
   script.js 在页面底部加载，那时浏览器已经渲染过第一帧，
   用户会看见重效果闪一下才切成精简版。

   判定顺序（任一命中就进精简模式）：
     ① 网址 ?lite=1 强制开，?lite=0 强制关（会记在本机，方便你自己控制）
     ② 上次的判定结果
     ③ 系统设置了「减少动态效果」
     ④ 显卡是核显（Intel UHD / HD Graphics 之类）
     ⑤ 运行中实测帧率过低 —— 由 script.js 兜底，覆盖认不出型号的机器

   判定失败一律当完整版。绝不能因为这个脚本出错导致白屏。
   ========================================================================== */
(function () {
  var root = document.documentElement;
  function goLite() { root.className += ' lite'; }

  try {
    /* ① 网址参数 */
    var q = null;
    try { q = new URLSearchParams(location.search).get('lite'); } catch (e) {}
    if (q === '1' || q === '0') {
      try { localStorage.setItem('chath100.lite', q); } catch (e) {}
      if (q === '1') goLite();
      return;
    }

    /* ② 上次的判定结果 */
    var saved = null;
    try { saved = localStorage.getItem('chath100.lite'); } catch (e) {}
    if (saved === '1') { goLite(); return; }
    if (saved === '0') { return; }

    /* ③ 系统级「减少动态效果」 */
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      goLite();
      return;
    }

    /* ④ 显卡型号 */
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) { goLite(); return; }        /* 连 WebGL 都拿不到，肯定弱 */

    var ext = gl.getExtension('WEBGL_debug_renderer_info');
    var gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '') : '';
    window.__gpu = gpu;
    console.info('[性能] 显卡：' + (gpu || '(浏览器未提供，可能被隐私设置屏蔽)'));

    /* 核显名单。注意 Iris Xe 不在里面 —— 它比 UHD 强得多，带得动。 */
    if (/intel.*\b(uhd|hd) graphics|microsoft basic|swiftshader|llvmpipe|software/i.test(gpu)) {
      console.info('[性能] 识别到核显，启用精简模式');
      goLite();
    }

    var lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();         /* 立刻释放，别占着显存 */
  } catch (e) {
    /* 判定失败就当完整版，不影响正常显示 */
  }
})();
</script></head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<!-- ============ 动态背景（结构和 index.html 一致） ============ -->
<div class="backdrop" aria-hidden="true">
  <span class="aurora aurora-1"></span>
  <span class="aurora aurora-2"></span>

  <span class="depth" data-depth="30">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
  </span>
  <span class="depth" data-depth="15">
    <span class="blob blob-3"></span>
  </span>

  <span class="grid-lines"><span class="grid-drift"></span></span>
  <span class="scan-beam"></span>

  <canvas class="particles" id="particles"></canvas>

  <span class="noise"></span>
</div>

<!-- 留言板不播开场动画（每次跳页都播会很烦） -->
<div class="cursor-ball" id="cursorBall" aria-hidden="true"></div>

<!-- ============ 顶部导航 ============ -->
<header class="nav" id="nav">
  <div class="nav-inner glass">
    <a class="brand" href="index.html">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-text">ChatH100</span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="index.html#about">关于</a>
      <a href="talk.html" class="is-active" aria-current="page">交流</a>
      <a href="index.html#contact">联系</a>
    </nav>

    <button class="nav-toggle" id="navToggle" type="button"
            aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="main" class="page-main">
  <section class="section">
    <div class="container">

      <header class="section-head reveal">
        <p class="section-kicker">Guestbook</p>
        <h1 class="section-title">留言板</h1>
        <p class="section-sub">留个名字，写几句话。不用注册，也不查邮箱。只保留最新 25 条。</p>
      </header>

      <!-- 这段文字会被 talk.js 按实际连接状态覆盖，这里只是没跑 JS 时的兜底 -->
      <p class="notice reveal" id="storageNotice">
        <strong>正在连接数据库……</strong>连上之后，留言所有访客都能看到。
      </p>

      <div class="gb-grid">

        <!-- ---------- 写留言 ---------- -->
        <form class="gb-form glass reveal" id="gbForm" novalidate>
          <h2 class="gb-form-title">写一条</h2>

          <label class="gb-label" for="gbName">昵称</label>
          <input class="gb-input" id="gbName" name="name" type="text"
                 maxlength="20" placeholder="怎么称呼你？"
                 autocomplete="nickname" required />

          <label class="gb-label" for="gbText">留言</label>
          <textarea class="gb-textarea" id="gbText" name="text" rows="5"
                    maxlength="300" placeholder="说点什么……" required></textarea>

          <label class="gb-label" for="gbFile">
            图片<span class="gb-label-opt">可选 · 最大 20 MB · 自动压缩后上传 · jpg / png / gif / webp</span>
          </label>
          <div class="gb-file-row">
            <input class="gb-file" id="gbFile" name="image" type="file"
                   accept="image/jpeg,image/png,image/gif,image/webp" />
            <button class="btn btn-ghost gb-file-clear" id="gbFileClear" type="button" hidden>移除</button>
          </div>
          <div class="gb-file-preview" id="gbFilePreview" hidden>
            <img id="gbFileThumb" alt="所选图片预览" />
          </div>
          <p class="gb-file-msg" id="gbFileMsg" role="status" aria-live="polite"></p>

          <div class="gb-form-foot">
            <span class="gb-counter" id="gbCounter">0 / 300</span>
            <button class="btn btn-primary" type="submit">发布</button>
          </div>

          <p class="gb-msg" id="gbMsg" role="status" aria-live="polite"></p>
        </form>

        <!-- ---------- 留言列表 ---------- -->
        <section class="gb-list-wrap glass reveal" aria-labelledby="gbListTitle">
          <div class="gb-list-head">
            <h2 class="gb-form-title" id="gbListTitle">大家的留言</h2>
            <span class="gb-count" id="gbCount">0 条</span>
          </div>

          <p class="gb-empty" id="gbEmpty">还没有人说话，第一条留给你。</p>
          <ul class="gb-list" id="gbList"></ul>
        </section>

      </div>

      <!-- 管理员面板：连上数据库、且地址栏带 #admin 时才显示（见 talk.js 的 syncAdminPanel） -->
      <aside class="gb-admin glass" id="gbAdmin" hidden>
        <h2 class="gb-form-title">管理员</h2>
        <p class="gb-admin-hint">
          密码在服务端比对，连错 3 次会锁定 8 分钟。这里只能<strong>清空全部留言</strong>，
          不能删单条 —— 单条只有发帖人凭本机密钥能删。
        </p>
        <label class="gb-label" for="gbAdminToken">管理员密码</label>
        <input class="gb-input" id="gbAdminToken" name="admin-token" type="password"
               autocomplete="off" spellcheck="false" />
        <div class="gb-form-foot">
          <button class="btn btn-ghost gb-admin-clear" id="gbAdminClear" type="button">清空全部留言</button>
        </div>
        <p class="gb-msg" id="gbAdminMsg" role="status" aria-live="polite"></p>
      </aside>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <p>© <span id="year">2026</span> ChatH100</p>
    <p class="footer-note">手写 HTML / CSS / JavaScript，没有框架。</p>
  </div>
</footer>

<script src="script.js?v=10"></script>
<script src="talk.js?v=10"></script>
</body>
</html>
